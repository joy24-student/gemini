global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'gemini-unofficial-api'

scrape_configs:
  - job_name: 'gemini_api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:9113']
    scrape_interval: 30s
