version: "3.9"

# ── Shared network ─────────────────────────────────────────────────────────────
networks:
  gemini_net:
    driver: bridge

# ── Named volumes for persistence ─────────────────────────────────────────────
volumes:
  gemini_data:      # conversation memory, sessions
  prometheus_data:  # metrics storage
  nginx_ssl:        # Let's Encrypt certificates

# ─────────────────────────────────────────────────────────────────────────────
services:

  # ── Core API Server ──────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: gemini-unofficial-api:latest
    container_name: gemini_api
    restart: unless-stopped
    networks:
      - gemini_net
    volumes:
      - gemini_data:/data
      # Mount cookies.json at runtime (never bake credentials into image)
      - ./cookies.json:/data/cookies.json:ro
    environment:
      # ── Authentication ────────────────────────────────────────────────────
      # Set these via .env file or Docker secrets — never hardcode here
      GEMINI_1PSID:    "${GEMINI_1PSID:-}"
      GEMINI_1PSIDTS:  "${GEMINI_1PSIDTS:-}"
      GEMINI_COOKIE_PATH: "/data/cookies.json"
      # ── Server ────────────────────────────────────────────────────────────
      HOST:     "0.0.0.0"
      PORT:     "8000"
      WORKERS:  "${API_WORKERS:-1}"
      # ── Observability ─────────────────────────────────────────────────────
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    expose:
      - "8000"       # internal only — nginx fronts externally
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M

  # ── Nginx Reverse Proxy ───────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: gemini_nginx
    restart: unless-stopped
    networks:
      - gemini_net
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_ssl:/etc/nginx/ssl
      # Serve the docs portal as static files
      - ./docs:/usr/share/nginx/html/docs:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 60s
      timeout: 5s
      retries: 2

  # ── Prometheus Metrics ────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: gemini_prometheus
    restart: unless-stopped
    networks:
      - gemini_net
    ports:
      - "127.0.0.1:9090:9090"   # localhost only — not exposed publicly
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    profiles:
      - monitoring   # opt-in: docker compose --profile monitoring up

  # ── Watchtower: Auto-update containers ────────────────────────────────────────
  watchtower:
    image: containrrr/watchtower:latest
    container_name: gemini_watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: "86400"   # check once per day
    profiles:
      - autoupdate   # opt-in: docker compose --profile autoupdate up
