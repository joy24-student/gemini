# Nginx reverse proxy configuration for Gemini Unofficial API
# Handles: HTTP → HTTPS redirect, SSL termination, SSE streaming, WebSocket proxy

upstream gemini_api {
    server api:8000;
    keepalive 16;
}

# ── HTTP → HTTPS redirect ──────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS API Server ───────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name _;

    # ── TLS ─────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS (6 months)
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Static Documentation Portal ──────────────────────────────────────────
    location /docs {
        alias /usr/share/nginx/html/docs;
        index index.html;
        try_files $uri $uri/ /docs/index.html;

        # Cache static assets
        location ~* \.(js|css|png|jpg|svg|ico|woff2)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── SSE Streaming Endpoints ───────────────────────────────────────────────
    location ~ ^/v1/chat/completions {
        proxy_pass         http://gemini_api;
        proxy_http_version 1.1;

        # SSE critical settings
        proxy_buffering          off;
        proxy_cache              off;
        proxy_read_timeout       300s;
        proxy_send_timeout       300s;
        proxy_connect_timeout    10s;
        chunked_transfer_encoding on;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # CORS headers
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # ── General API endpoints ─────────────────────────────────────────────────
    location / {
        proxy_pass         http://gemini_api;
        proxy_http_version 1.1;
        proxy_read_timeout       60s;
        proxy_connect_timeout    10s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # CORS
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # ── Restrict internal metrics endpoint ────────────────────────────────────
    location /metrics {
        allow 127.0.0.1;
        allow 172.16.0.0/12;   # Docker internal subnet
        deny all;
        proxy_pass http://gemini_api;
    }

    client_max_body_size 25M;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
}
